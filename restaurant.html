<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PUKORET HOMES Restaurant POS</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .category-title { margin-top: 20px; font-size: 20px; font-weight: bold; color: #b91c1c; }
    </style>
</head>
<body>


<!-- Side vertical icons -->
<div id="sideNav" style="position:fixed;top:50%;left:0;transform:translateY(-50%);z-index:1200;display:flex;flex-direction:column;gap:18px;padding:12px 0;">
    <a href="restaurant.html" title="Restaurant" class="side-icon active" style="display:flex;align-items:center;justify-content:center;width:54px;height:54px;background:var(--color-primary);border-radius:50%;box-shadow:var(--shadow-xs);color:var(--color-white);font-weight:bold;border:2px solid var(--color-primary-dark);margin-bottom:8px;transition:transform 0.18s, box-shadow 0.18s;">
        <span style="font-size:2em;">🍴</span>
    </a>
    <a href="status.html" title="Motel" class="side-icon" style="display:flex;align-items:center;justify-content:center;width:54px;height:54px;background:var(--color-primary-lighter);border-radius:50%;box-shadow:var(--shadow-xs);transition:transform 0.18s, box-shadow 0.18s;">
        <span style="font-size:2em;">🛏️</span>
    </a>
</div>
<style>
    #sideNav { top: 38%; }
    .side-icon:hover {
        transform: scale(1.18);
        box-shadow: 0 4px 18px rgba(0,0,0,0.18);
        z-index: 1300;
    }
    .side-icon.active {
        box-shadow: 0 4px 18px rgba(0,0,0,0.22);
        transform: scale(1.12);
    }
</style>
</div>

<header style="display:flex;align-items:center;justify-content:space-between;padding:var(--spacing-md) var(--spacing-xl);background:var(--color-primary-lighter);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);margin-bottom:var(--spacing-lg);">
    <h2 style="color:var(--color-primary);font-size:var(--font-size-2xl);font-weight:var(--font-weight-bold);margin:0;">Restaurant POS</h2>
    <button onclick="logout()" style="background:var(--color-danger);color:var(--color-white);border:none;padding:var(--spacing-sm) var(--spacing-lg);border-radius:var(--radius-md);font-size:var(--font-size-base);font-weight:var(--font-weight-semibold);box-shadow:var(--shadow-xs);cursor:pointer;transition:background var(--transition-fast);">Logout</button>
</header>

<main class="page-container">
    <h1 class="page-title" style="color:var(--color-primary);font-size:var(--font-size-xl);font-weight:var(--font-weight-bold);margin-bottom:var(--spacing-md);">PUKORET HOMES RESTAURANT POS</h1>

    <div class="grid">
    <section class="card" style="background:var(--color-primary-lighter);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);padding:var(--spacing-lg);margin-bottom:var(--spacing-lg);">
        <h3 style="color:var(--color-primary);font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);margin-bottom:var(--spacing-md);">Menu</h3>
        <div id="menuList"></div>
    </section>

    <aside class="card" style="background:var(--color-secondary-lighter);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);padding:var(--spacing-lg);">
        <h3 style="color:var(--color-primary);font-size:var(--font-size-xl);font-weight:var(--font-weight-bold);margin-bottom:var(--spacing-md);letter-spacing:1px;">Current Order</h3>
        <div style="background:var(--color-white);border-radius:var(--radius-md);box-shadow:var(--shadow-xs);padding:var(--spacing-md);margin-bottom:var(--spacing-md);">
            <table style="width:100%;border-collapse:collapse;">
                <thead>
                    <tr style="background:var(--color-primary-lighter);color:var(--color-primary);font-weight:var(--font-weight-semibold);">
                        <th style="padding:8px 0;">Item</th>
                        <th>Qty</th>
                        <th>Price</th>
                        <th>Total</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="cartBody"></tbody>
            </table>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:var(--spacing-md);">
            <div style="font-size:var(--font-size-base);color:var(--color-secondary-dark);display:flex;justify-content:space-between;">
                <span>Subtotal:</span> <span>Ksh <span id="subtotal">0</span></span>
            </div>
            <!-- VAT logic and markup fully removed -->
            <div style="font-size:var(--font-size-lg);color:var(--color-primary);font-weight:var(--font-weight-bold);display:flex;justify-content:space-between;">
                <span>Total:</span> <span>Ksh <span id="grandTotal">0</span></span>
            </div>
        </div>
        <select id="paymentMethod" style="margin-bottom:var(--spacing-md);padding:var(--spacing-sm);border-radius:var(--radius-md);width:100%;background:var(--color-primary-lighter);color:var(--color-primary);font-weight:var(--font-weight-semibold);">
            <option>Cash</option>
            <option>Card</option>
            <option>M-Pesa</option>
        </select>
        <div style="margin-top:10px;display:flex;gap:12px;justify-content:flex-end;">
            <button class="action-btn" onclick="submitOrder()" style="background:var(--color-success);color:var(--color-white);font-weight:var(--font-weight-bold);">Submit Order</button>
            <button class="action-btn" onclick="clearCart()" style="background:var(--color-danger);color:var(--color-white);font-weight:var(--font-weight-bold);">Clear</button>
        </div>
    </aside>
</main>

<script src="js/restaurant.js"></script>
<script src="js/restaurant.receipt.js"></script>

<!-- Floating Receipt Modal -->
<div id="restaurantReceiptModal" class="modal" style="display:none;align-items:center;justify-content:center;">
    <div class="modal-content receipt-print" style="max-width:420px;width:100%;background:#fff;padding:0;position:relative;">
        <span class="close-modal" onclick="closeRestaurantReceiptModal()" style="right:18px;top:12px;position:absolute;cursor:pointer;font-size:2em;">&times;</span>
        <div id="restaurantReceiptDetails"></div>
    </div>
    <div style="position:fixed;top:32px;right:32px;z-index:1200;display:flex;flex-direction:column;align-items:flex-end;">
      <button class="action-btn" id="printRestaurantReceiptBtn" onclick="printRestaurantReceipt()" style="margin-bottom:8px;display:none;">Print Receipt</button>
      <button class="action-btn" id="closeRestaurantReceiptBtn" onclick="closeRestaurantReceiptModal()" style="background:var(--color-warning);color:var(--color-white);display:none;">Close Receipt</button>
    </div>
</div>
<style>
    .receipt-print {
        font-family: 'Courier New', Courier, monospace;
        padding: 0;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.10);
        background: #fff;
    }
    .receipt-print .r-header {
        font-size: 1.6em;
        font-weight: bold;
        text-align: center;
        margin-top: 18px;
        letter-spacing: 2px;
    }
    .receipt-print .r-sub {
        text-align: center;
        font-size: 1em;
        margin-bottom: 8px;
        color: #222;
    }
    .receipt-print .r-divider {
        border-top: 2px solid #222;
        margin: 12px 0;
    }
    .receipt-print .r-section {
        margin: 10px 0;
        font-size: 1.08em;
    }
    .receipt-print .r-label {
        display: inline-block;
        min-width: 120px;
        font-weight: bold;
        text-align: left;
    }
    .receipt-print .r-value {
        float: right;
        font-weight: bold;
        text-align: right;
    }
    .receipt-print .r-row {
        clear: both;
        margin-bottom: 4px;
    }
    .receipt-print .r-total {
        font-size: 1.2em;
        font-weight: bold;
        margin: 10px 0;
        text-align: right;
    }
    .receipt-print .r-welcome {
        text-align: center;
        margin-top: 18px;
        font-size: 1.08em;
        color: #222;
    }
    @media print {
        body * { visibility: hidden; }
        #restaurantReceiptModal, #restaurantReceiptModal * { visibility: visible; }
        #restaurantReceiptModal { position: absolute; left: 0; top: 0; width: 100%; }
        .close-modal, .action-btn { display: none !important; }
    }
</style>

</body>
</html>
